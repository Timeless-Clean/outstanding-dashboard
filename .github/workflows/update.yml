name: Update outstanding dashboard

on:
  schedule:
    - cron: '0 23 * * 0-4'   # 09:00 Sydney (AEST), Mon-Fri
    - cron: '0 3 * * 1-5'    # 13:00 Sydney (AEST), Mon-Fri
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          XERO_CLIENT_ID:     ${{ secrets.XERO_CLIENT_ID }}
          XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
          XERO_REFRESH_TOKEN: ${{ secrets.XERO_REFRESH_TOKEN }}
        run: python build_dashboard.py
      - name: Commit updated dashboard + rotated token
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html token.json
          git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
